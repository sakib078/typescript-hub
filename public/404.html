<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeScript Hub</title>
  <!--
    Single-Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
    GitHub Pages serves this file for any unknown path. It encodes the requested
    path into a query string and redirects to the app root, where the snippet in
    index.html restores it and lets React Router handle the route (or show 404).
    pathSegmentsToKeep = 1 keeps the "/typescript-hub" project base path.
  -->
  <script>
    (function () {
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }());
  </script>
</head>

<body></body>

</html>
