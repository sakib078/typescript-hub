<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="TypeScript Hub" />
  <link rel="icon" type="image/svg+xml" href="/typescript-hub/favicon.svg" />

  <!--
    Per-page <title>, description, canonical, Open Graph, Twitter, and JSON-LD
    are injected by each route's <Seo> component (react-helmet-async via
    vite-react-ssg). Intentionally NOT set here — a static <title> would be
    appended alongside Helmet's, producing two <title> tags per page.
  -->

  <meta name="google-site-verification" content="EgfXR48ETw8Nt2kyajIEP41KqDNOl2soOTmdVhU71wc" />

  <!-- Single-Page Apps for GitHub Pages: restore the deep link saved by 404.html -->
  <script>
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D955QLRWMV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-D955QLRWMV');
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
